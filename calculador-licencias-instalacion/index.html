<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculador de licencias de instalación</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <h1>Licencias de instalación</h1>
      </div>
    </header>

    <main class="container layout">
      <section class="items-section" aria-labelledby="items-title">
        <div class="section-heading">
          <h2 id="items-title">Partidas</h2>
          <p>Selecciona una partida para configurar sus items.</p>
        </div>
        <div
          id="partida-tabs"
          class="tabs"
          role="tablist"
          aria-label="Partidas"
        ></div>
        <div
          class="partida-summary"
          id="partida-summary"
          aria-live="polite"
        ></div>
        <div class="items-table" role="table" aria-label="Lista de items">
          <div class="table-row table-header" role="row">
            <span role="columnheader">Item</span>
            <span role="columnheader">Precio unitario</span>
            <span role="columnheader">Cantidad</span>
            <span role="columnheader">Subtotal</span>
          </div>
          <div id="items-list" class="items-list" role="rowgroup">
            <p class="loading-message">Cargando items...</p>
          </div>
        </div>
      </section>

      <aside class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title">Resumen</h2>
        <dl class="summary-list">
          <div>
            <dt>Unidades seleccionadas</dt>
            <dd id="total-units">0</dd>
          </div>
        </dl>
        <div class="cart-preview" aria-labelledby="cart-preview-title">
          <h3 id="cart-preview-title">Carrito</h3>
          <div class="cart-preview-header" aria-hidden="true">
            <span>Licencia</span>
            <span>Cant.</span>
            <span>P.Unit.</span>
            <span>Total</span>
          </div>
          <div
            id="cart-preview-list"
            class="cart-preview-list"
            aria-live="polite"
          ></div>
        </div>
        <dl class="summary-list summary-list-total">
          <div>
            <dt>Total instalación</dt>
            <dd id="total-price">0,00&nbsp;€</dd>
          </div>
        </dl>
        <button id="reset-button" class="reset-button" type="button">
          Limpiar cantidades
        </button>
      </aside>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
